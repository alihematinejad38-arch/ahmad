name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Launcher icons
        run: |
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r icons/. android/app/src/main/res/
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            msg=$(grep -n -i -A8 "What went wrong\|error:" /tmp/build.log | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=GRADLE_FAIL::$msg"
            tail -30 /tmp/build.log
            exit $rc
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ohs-training-portal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ohs-training-portal.apk
          gh release create "v1.0.${{ github.run_number }}" ohs-training-portal.apk --title "APK build ${{ github.run_number }}" --notes "Debug APK"
