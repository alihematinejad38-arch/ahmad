name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: Portrait + RTL friendly manifest tweaks
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:supportsRtl="true"/' $M
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="unspecified"/' $M || true
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ohs-training-portal-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
