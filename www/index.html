<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>پورتال آموزشی بهداشت حرفه‌ای</title>
<style>
:root{--gold:#f2c66d;--gold2:#fff1c9;--T:9s}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:"BNazanin",Tahoma,"Vazirmatn",sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:#000}

/* عکس با حرکت دوربین (Ken Burns) */
#photo{position:absolute;inset:-6%;background:url(valiasr.jpg) 0% 50%/cover no-repeat;opacity:0;
  transform:scale(1.18);will-change:transform,background-position,opacity;
  animation:fadein 1.8s ease-out .5s forwards,pan var(--T) cubic-bezier(.45,.05,.35,1) .5s forwards,zoom var(--T) ease-out .5s forwards}
@keyframes fadein{to{opacity:1}}
@keyframes pan{from{background-position:0% 50%}to{background-position:100% 50%}}
@keyframes zoom{from{transform:scale(1.22)}to{transform:scale(1.02)}}

#blur{position:absolute;inset:-8%;background:url(valiasr.jpg) 50% 50%/cover no-repeat;filter:blur(22px) brightness(.5) saturate(1.3);opacity:0;animation:fadein 1.8s ease-out .3s forwards}
@media(orientation:portrait){
  #photo{inset:auto;left:0;right:0;top:27vh;height:46vh;background-size:auto 100%;
    animation:fadein 1.8s ease-out .5s forwards,pan var(--T) cubic-bezier(.45,.05,.35,1) .5s forwards,zoomp var(--T) ease-out .5s forwards;
    box-shadow:0 0 60px rgba(0,0,0,.7)}
  #photo::before,#photo::after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(242,198,109,.7),transparent)}
  #photo::before{top:0}#photo::after{bottom:0}
}
@keyframes zoomp{from{transform:scale(1.12)}to{transform:scale(1)}}
#blur{display:block}
@media(orientation:landscape){#blur{display:none}}
/* سایه‌ی سینمایی و رنگ‌بندی */
#grade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%),
  linear-gradient(180deg,rgba(0,0,0,.45),transparent 26%,transparent 60%,rgba(0,0,0,.8));mix-blend-mode:normal}

/* باریکه‌ی نور */
#flare{position:absolute;top:-20%;bottom:-20%;left:-40%;width:35%;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,transparent,rgba(255,244,210,.35) 50%,transparent);transform:skewX(-14deg);
  animation:sweep 2.6s ease-in-out 1.4s forwards}
@keyframes sweep{0%{opacity:0;left:-40%}20%{opacity:1}100%{opacity:0;left:120%}}

/* نوارهای سینمایی */
.bar{position:absolute;left:0;right:0;background:#000;z-index:5;height:0;animation:bars 1.2s cubic-bezier(.2,.7,.2,1) .1s forwards}
.bar.t{top:0}.bar.b{bottom:0}
@keyframes bars{to{height:11vh}}

/* ذرات گرد و غبار نورانی */
#dust{position:absolute;inset:0;pointer-events:none;z-index:2}

/* متن‌ها */
#cap{position:absolute;left:0;right:0;bottom:13vh;z-index:6;text-align:center;padding:0 24px}
.lab{display:inline-block;font-size:clamp(12px,3.3vw,16px);letter-spacing:.35em;color:var(--gold);opacity:0;
  animation:rise 1.2s ease-out 2.2s forwards;padding-bottom:6px;position:relative}
.lab::after{content:"";position:absolute;left:50%;bottom:0;height:1px;width:0;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  transform:translateX(-50%);animation:line 1.4s ease-out 2.6s forwards}
@keyframes line{to{width:min(70vw,360px)}}
.name{display:block;margin-top:10px;font-weight:700;font-size:clamp(34px,10.5vw,64px);line-height:1.3;
  background:linear-gradient(100deg,var(--gold) 0%,var(--gold2) 45%,var(--gold) 60%,#c58b2f 100%);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 28px rgba(242,198,109,.35);opacity:0;filter:blur(12px);letter-spacing:.06em;
  animation:reveal 1.8s cubic-bezier(.2,.7,.2,1) 2.7s forwards,shine 3.2s ease-in-out 4.4s forwards}
@keyframes reveal{from{opacity:0;filter:blur(12px);transform:translateY(14px) scale(1.06)}to{opacity:1;filter:blur(0);transform:none}}
@keyframes shine{from{background-position:100% 0}to{background-position:0% 0}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

#ttl{position:absolute;left:0;right:0;top:15vh;z-index:6;text-align:center;padding:0 24px;opacity:0;
  animation:rise 1.4s ease-out 5.2s forwards}
#ttl small{display:block;font-size:clamp(12px,3.4vw,17px);color:#cfe9f2;letter-spacing:.12em;margin-bottom:4px}
#ttl b{display:block;font-size:clamp(20px,6vw,34px);text-shadow:0 2px 18px rgba(0,0,0,.85)}

#skip{position:absolute;z-index:9;top:max(14px,env(safe-area-inset-top));left:14px;font:inherit;font-size:13px;color:#fff;
  background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:3px 14px;cursor:pointer;
  backdrop-filter:blur(4px);opacity:0;animation:rise .8s ease-out 1.2s forwards}

/* محو پایانی */
#out{position:absolute;inset:0;background:#02060d;opacity:0;z-index:10;pointer-events:none;transition:opacity .9s ease}
#out.on{opacity:1}

@media(prefers-reduced-motion:reduce){#photo{animation:fadein 1s ease-out forwards;transform:none}#flare{display:none}.bar{animation:none;height:8vh}}
</style>
</head>
<body>
<div id="stage">
  <div id="blur"></div>
  <div id="photo"></div>
  <canvas id="dust"></canvas>
  <div id="flare"></div>
  <div id="grade"></div>
  <div class="bar t"></div><div class="bar b"></div>

  <div id="ttl"><small>بیمارستان ولیعصر</small><b>پورتال آموزشی بهداشت حرفه‌ای</b></div>

  <div id="cap">
    <span class="lab">طراحی و توسعه</span>
    <span class="name">احمد خوشرو</span>
  </div>

  <button id="skip" type="button">رد کردن ›</button>
  <div id="out"></div>
</div>
<script>
(function(){
  var go=function(){location.replace("portal.html")},done=false;
  function finish(){if(done)return;done=true;document.getElementById("out").classList.add("on");setTimeout(go,900)}
  document.getElementById("skip").addEventListener("click",finish);
  document.getElementById("stage").addEventListener("click",function(e){if(e.target.id==="skip")return});
  setTimeout(finish,9200);

  // ذرات نورانی
  var c=document.getElementById("dust"),x=c.getContext("2d"),W,H,P=[],still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){W=c.width=innerWidth;H=c.height=innerHeight;P=Array.from({length:Math.round(W*H/14000)},function(){return{x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.6+.3,v:Math.random()*.25+.05,ph:Math.random()*6.28}})}
  size();addEventListener("resize",size);
  (function t(ts){if(done)return;x.clearRect(0,0,W,H);
    for(var i=0;i<P.length;i++){var p=P[i];if(!still){p.y-=p.v;p.x+=Math.sin(ts/1800+p.ph)*.15;if(p.y<-4){p.y=H+4;p.x=Math.random()*W}}
      x.globalAlpha=(.25+.5*Math.sin(ts/700+p.ph)**2)*.7;x.fillStyle="#ffe7a8";x.beginPath();x.arc(p.x,p.y,p.r,0,6.283);x.fill()}
    requestAnimationFrame(t)})(0);
})();
</script>
</body>
</html>
